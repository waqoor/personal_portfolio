name: production-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install backend and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff formatting
        run: ruff format --check apps services packages tests
      - name: Ruff lint
        run: ruff check apps services packages tests
      - name: Strict type checking
        run: mypy apps services packages
      - name: Unit, contract, architecture, and SQLite integration coverage
        run: |
          mkdir -p output
          pytest -m "not integration" \
            --cov=apps --cov=services --cov=packages \
            --cov-report=term-missing --cov-report=xml:output/coverage.xml
      - name: Static security analysis
        run: bandit -c pyproject.toml -r apps services packages/python
      - name: Locked runtime dependency audit
        run: pip-audit --requirement requirements.lock

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: integration-db-credential-2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CORE_TEST_DATABASE_URL: postgresql+asyncpg://portfolio:integration-db-credential-2026@localhost:5432/portfolio_test
      DATABASE_URL: postgresql+asyncpg://portfolio:integration-db-credential-2026@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Apply and inspect the migration graph
        run: alembic upgrade head && alembic current && alembic heads
      - name: PostgreSQL-specific invariants and metadata drift
        run: pytest -m integration -q

  frontend-quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://portfolio.example.com
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  production-compose-e2e:
    runs-on: ubuntu-latest
    needs: [backend-quality, postgres-integration, frontend-quality]
    timeout-minutes: 35
    env:
      PORTFOLIO_ENV_FILE: deploy/e2e.env
      PORTFOLIO_ENVIRONMENT: production
      PORTFOLIO_PUBLIC_BASE_URL: https://portfolio.example.com
      PORTFOLIO_AUTH_SECRET: ci-auth-secret-2026-independent-00000001
      PORTFOLIO_PRIVACY_HASH_SECRET: ci-privacy-secret-2026-independent-0001
      POSTGRES_PASSWORD: ci-db-credential-2026-strong
      SITE_ADDRESS: https://localhost
      HTTP_PORT: "18080"
      HTTPS_PORT: "18443"
      HTTPS_UDP_PORT: "18443"
      IMAGE_TAG: ci-${{ github.sha }}
      PORTFOLIO_E2E_BASE_URL: https://localhost:18443
      PORTFOLIO_E2E_EXPECTED_NAME: Integration Test Portfolio
      PORTFOLIO_E2E_ADMIN_EMAIL: e2e-owner@example.com
      PORTFOLIO_E2E_ADMIN_PASSWORD: Ci-E2e-Owner-2026!
      PORTFOLIO_ADMIN_PASSWORD: Ci-E2e-Owner-2026!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate Compose and edge configuration
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build production images
        run: docker compose build --pull
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yazeed-portfolio-api:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yazeed-portfolio-web:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Start the production topology
        run: docker compose up -d
      - name: Wait for edge and API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --insecure https://localhost:18443/health/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1
      - name: Seed fictional canonical E2E content
        run: >-
          docker compose run --rm
          -v "${{ github.workspace }}/tests/fixtures/e2e:/seed:ro"
          api portfolio-seed apply --file /seed/manifest.json --approve
      - name: Create isolated E2E owner
        run: >-
          docker compose exec -T
          -e PORTFOLIO_ADMIN_PASSWORD="${PORTFOLIO_ADMIN_PASSWORD}"
          api
          portfolio-admin create-admin
          --email "${PORTFOLIO_E2E_ADMIN_EMAIL}"
          --display-name "E2E Owner"
          --role owner
      - name: Verify database and media backup/restore
        run: |
          backup_output="$(docker compose --profile operations run --rm backup)"
          printf '%s\n' "$backup_output"
          database_backup="$(printf '%s\n' "$backup_output" | sed -n 's/^database_backup_created=//p' | tail -1)"
          media_backup="$(printf '%s\n' "$backup_output" | sed -n 's/^media_backup_created=//p' | tail -1)"
          test -n "$database_backup"
          test -n "$media_backup"
          docker compose stop proxy web api
          docker compose --profile operations run --rm \
            -e CONFIRM_RESTORE=RESTORE restore "$database_backup" "$media_backup"
          docker compose up -d
      - name: Wait for restored topology
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --insecure https://localhost:18443/health/ready; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Canonical Playwright E2E, accessibility, security, and performance
        run: npm run test:e2e
      - name: Capture Compose logs on failure
        if: failure()
        run: |
          mkdir -p output/playwright
          docker compose logs --no-color > output/playwright/compose.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production-evidence
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
