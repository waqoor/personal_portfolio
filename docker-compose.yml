name: yazeed-portfolio

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  db:
    <<: *service-security
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: yazeed-portfolio-api:${IMAGE_TAG:-local}
    environment:
      PORTFOLIO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portfolio}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  media-init:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command:
      - /bin/sh
      - -ec
      - |
        install -d -m 0750 -o 10001 -g 10001 /media
        chown -R 10001:10001 /media
        chmod 0750 /media
    volumes:
      - media_data:/media
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    <<: *service-security
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: yazeed-portfolio-api:${IMAGE_TAG:-local}
    env_file:
      - path: ${PORTFOLIO_ENV_FILE:-.env}
        required: true
    environment:
      PORTFOLIO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portfolio}
      PORTFOLIO_STORAGE_ROOT: /app/var/media
      PORTFOLIO_ENVIRONMENT: ${PORTFOLIO_ENVIRONMENT:-production}
      PORTFOLIO_AUTH_SECRET: ${PORTFOLIO_AUTH_SECRET:?Set PORTFOLIO_AUTH_SECRET in .env}
      PORTFOLIO_PRIVACY_HASH_SECRET: ${PORTFOLIO_PRIVACY_HASH_SECRET:?Set PORTFOLIO_PRIVACY_HASH_SECRET in .env}
      PORTFOLIO_ADMIN_EMAIL: ${PORTFOLIO_ADMIN_EMAIL:-}
      PORTFOLIO_ADMIN_PASSWORD: ${PORTFOLIO_ADMIN_PASSWORD:-}
      FORWARDED_ALLOW_IPS: ${PORTFOLIO_FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/var/media
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - backend

  web:
    <<: *service-security
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_SITE_URL: ${PORTFOLIO_PUBLIC_BASE_URL:?Set PORTFOLIO_PUBLIC_BASE_URL in .env}
        API_PROXY_TARGET: http://api:8000
    image: yazeed-portfolio-web:${IMAGE_TAG:-local}
    environment:
      API_BASE_URL: http://api:8000/api/v1
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${PORTFOLIO_PUBLIC_BASE_URL:?Set PORTFOLIO_PUBLIC_BASE_URL in .env}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0750
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  proxy:
    <<: *service-security
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      HTTPS_REDIRECT_ORIGIN: ${HTTPS_REDIRECT_ORIGIN:-https://localhost:18445}
      EDGE_CONTENT_SECURITY_POLICY: "${EDGE_CONTENT_SECURITY_POLICY:-default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; manifest-src 'self'}"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-18444}:80"
      - "${HTTPS_PORT:-18445}:443"
      - "${HTTPS_UDP_PORT:-18445}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - edge
      - backend

  backup:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["operations"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-portfolio}
      PGUSER: ${POSTGRES_USER:-portfolio}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    volumes:
      - ./deploy/scripts:/scripts:ro
      - postgres_backups:/backups
      - media_data:/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  restore:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["operations"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-portfolio}
      PGUSER: ${POSTGRES_USER:-portfolio}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MEDIA_UID: "10001"
      MEDIA_GID: "10001"
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]
    volumes:
      - ./deploy/scripts:/scripts:ro
      - postgres_backups:/backups:ro
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_data:
  postgres_backups:
  media_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
