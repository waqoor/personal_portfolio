[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "yazeed-hasan-portfolio"
version = "0.1.0"
description = "Production portfolio platform monorepo"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
portfolio-admin = "apps.api.manage:main"
portfolio-seed = "apps.api.seed:main"

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "bandit[toml]>=1.8,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "packages"]
exclude = ["/apps/web", "/packages/frontend"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
testpaths = ["tests", "services"]
markers = [
  "integration: requires an integration dependency such as PostgreSQL",
  "security: security-sensitive behavior",
]

[tool.coverage.run]
branch = true
source = ["apps", "services", "packages"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", ".next", "output", "db/migrations/versions"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"services/**/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "services/*/tests"]
skips = ["B101"]
